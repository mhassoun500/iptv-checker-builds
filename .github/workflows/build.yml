name: Build IPTV Checker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: ".exe"
            icon: "--icon app.ico"
          - os: macos-latest
            label: macos
            ext: ""
            icon: ""
          - os: ubuntu-latest
            label: linux
            ext: ""
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build standalone
        run: pyinstaller --onefile --noconfirm --name IPTV_Checker ${{ matrix.icon }} iptv_checker.py
      - name: Prepare output
        shell: bash
        run: |
          mkdir -p out
          cp "dist/IPTV_Checker${{ matrix.ext }}" "out/IPTV_Checker-${{ matrix.label }}${{ matrix.ext }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV_Checker-${{ matrix.label }}
          path: out/*
