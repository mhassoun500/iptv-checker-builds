name: Build Mo IPTV Checker

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (extract)
        run: python -m unittest -v tests.test_extract

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # ============================================================
      # Windows: portable .exe  +  Setup.exe installer (Inno Setup)
      # ============================================================
      - name: Build (Windows)
        if: matrix.label == 'windows'
        run: pyinstaller --onefile --windowed --noconfirm --name "Mo IPTV Checker" --icon app.ico iptv_checker.py

      - name: Make Inno Setup script (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION\\s*=\\s*\"([^\"]+)\"',open('iptv_checker.py',encoding='utf-8').read()).group(1))")
          echo "Building installer for version $V"
          cat > installer.iss <<ISS
          #define AppName "Mo IPTV Checker"
          #define AppVersion "$V"
          #define AppExe "Mo IPTV Checker.exe"

          [Setup]
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=mhassoun500
          DefaultDirName={autopf}\\Mo IPTV Checker
          DefaultGroupName=Mo IPTV Checker
          UninstallDisplayIcon={app}\\{#AppExe}
          OutputBaseFilename=Mo IPTV Checker Setup
          OutputDir=installer_out
          SetupIconFile=app.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          DisableProgramGroupPage=yes

          [Languages]
          Name: "en"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Shortcuts:"

          [Files]
          Source: "dist\\Mo IPTV Checker.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\\Mo IPTV Checker"; Filename: "{app}\\{#AppExe}"
          Name: "{autodesktop}\\Mo IPTV Checker"; Filename: "{app}\\{#AppExe}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\\{#AppExe}"; Description: "Launch Mo IPTV Checker"; Flags: nowait postinstall skipifsilent
          ISS

      - name: Install Inno Setup (Windows)
        if: matrix.label == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Compile installer (Windows)
        if: matrix.label == 'windows'
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Package (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          mkdir out
          cp "dist/Mo IPTV Checker.exe" "out/Mo IPTV Checker-windows.exe"
          cp "installer_out/Mo IPTV Checker Setup.exe" "out/Mo IPTV Checker Setup.exe"

      # ============================================================
      # macOS: .app bundle  +  .dmg installer
      # ============================================================
      - name: Make .icns (macOS)
        if: matrix.label == 'macos'
        run: |
          mkdir icon.iconset
          sips -z 16 16     app.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     app.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     app.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     app.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   app.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   app.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   app.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   app.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   app.png --out icon.iconset/icon_512x512.png
          cp app.png        icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o app.icns

      - name: Build (macOS .app)
        if: matrix.label == 'macos'
        run: |
          pyinstaller --windowed --noconfirm --name "Mo IPTV Checker" --icon app.icns \
            --osx-bundle-identifier com.mhassoun500.moiptvchecker iptv_checker.py
          V=$(python -c "import re;print(re.search(r'VERSION\\s*=\\s*\"([^\"]+)\"',open('iptv_checker.py',encoding='utf-8').read()).group(1))")
          P="dist/Mo IPTV Checker.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Mo IPTV Checker" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $V" "$P"
          codesign --force --deep --sign - "dist/Mo IPTV Checker.app" 

      - name: Build .dmg (macOS)
        if: matrix.label == 'macos'
        run: |
          xattr -cr "dist/Mo IPTV Checker.app" || true
          mkdir -p dmg_stage
          cp -R "dist/Mo IPTV Checker.app" "dmg_stage/Mo IPTV Checker.app"
          ln -s /Applications "dmg_stage/Applications"
          mkdir out
          hdiutil create -volname "Mo IPTV Checker" \
            -srcfolder dmg_stage -ov -format UDZO \
            "out/Mo IPTV Checker.dmg"

      - name: Package .zip too (macOS)
        if: matrix.label == 'macos'
        run: |
          ditto -c -k --keepParent "dist/Mo IPTV Checker.app" "out/Mo IPTV Checker-macos.zip"

      # ============================================================
      # Linux: single binary
      # ============================================================
      - name: Build (Linux)
        if: matrix.label == 'linux'
        run: pyinstaller --onefile --noconfirm --name Mo_IPTV_Checker iptv_checker.py
      - name: Package (Linux)
        if: matrix.label == 'linux'
        run: |
          mkdir out
          cp "dist/Mo_IPTV_Checker" "out/Mo_IPTV_Checker-linux"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mo_IPTV_Checker-${{ matrix.label }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect files
        run: |
          mkdir rel
          T="${GITHUB_REF_NAME}"
          for f in dl/*/*; do
            b=$(basename "$f" | sed 's/ /_/g; s/^Mo_IPTV_Checker/Mo_IPTV_Checker_'"$T"'/')
            cp "$f" "rel/$b"
          done
          ls -la rel
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          generate_release_notes: true
